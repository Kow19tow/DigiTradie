name: Site monitor
# Checks uptime, security headers, TLS expiry and that no build files are exposed.
# If a check fails, GitHub emails the repository owner (Settings > Notifications keeps this on by default).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/monitor.py
